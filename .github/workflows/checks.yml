name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.1'
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: npx tsx scripts/network-browser-check.ts
      - run: npx tsx scripts/language-check.ts
      - run: npx tsx scripts/visual-check.ts
      - run: node scripts/fetch-runtime.mjs
      - run: npm run package
      - run: dotnet build native/Linchuan.Desktop/Linchuan.Desktop.csproj -c Release
      - run: dotnet run --project native/Linchuan.Desktop.Tests -c Release
      - shell: pwsh
        run: ./scripts/build-desktop.ps1
      - shell: pwsh
        run: ./scripts/test-desktop.ps1
